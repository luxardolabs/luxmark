# ONE compose file for luxmark (repo.compose_conventions): the image is BUILT OUTSIDE compose
# (`make release`) and pulled here by an explicit, pinned tag. No `build:` stanza — a
# compose that builds makes "what is deployed" depend on the working directory, and no `:latest` —
# a floating deploy tag means a restart can silently change the running version.
#
# TAG is required (`${TAG:?}`), so a missing value fails loudly instead of defaulting to something.
# Set it in .env (see .env.example), normally to the VERSION being deployed.
name: luxmark

services:
  luxmark:
    image: ${LUXMARK_IMAGE:-ghcr.io/luxardolabs/luxmark}:${TAG:?set TAG to the version being deployed}
    container_name: luxmark-web
    restart: unless-stopped
    # When the host runs out of memory, the kernel kills a test or guard container (+500) first.
    oom_score_adj: -500
    # No host port: every edge reaches nginx over the docker network on 8080, and a publish would let
    # the host's network reach it around the edge. To serve it on a host port, use `docker run -p`.
    expose:
      - "8080"
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=1024
    # Hardening: nothing in this image needs to write to its own filesystem.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first and nginx listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # The edge network comes from the env file. Prod (.env): the shared `luxardolabs` network, where the
    # OVH edge proxies luxmark.luxardolabs.com to http://luxmark:8080 (nginx-ovh
    # conf.d/luxmark.luxardolabs.com.conf), so the container answers to that alias. Dev (.env.dev):
    # EDGE_NETWORK=dev-edge and EDGE_IPV4, the address infra pinned in its dev-edge table,
    # which the dev edge proxies dev-luxmark.luxardolabs.com to. Unset, compose pins no address.
    networks:
      edge:
        aliases:
          - luxmark
        ipv4_address: ${EDGE_IPV4:-}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

networks:
  edge:
    name: ${EDGE_NETWORK:-luxardolabs}
    external: true
